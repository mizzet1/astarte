name: Build and Test

on:
  # Run when pushing to stable branches
  push:
    branches:
      - "master"
      - "release-[0-9]+.[0-9]+"
  # Run on branch/tag creation
  create:
  # Run on pull requests
  pull_request:

env:
  elixir_version: "1.15.7"
  otp_version: "26.1"

jobs:
  test-dialyzer:
    name: Check Dialyzer
    runs-on: ubuntu-26.04
    env:
      MIX_ENV: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: deps
          key: ${{ runner.os }}-${{ env.elixir_version }}-${{ env.otp_version }}-mix-${{ hashFiles(format('{0}{1}', github.workspace, '/mix.lock')) }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: _build
          key: ${{ runner.os }}-${{ env.elixir_version }}-${{ env.otp_version }}-_build-${{ hashFiles(format('{0}{1}', github.workspace, '/mix.lock')) }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ env.elixir_version }}-${{ env.otp_version }}-_build-${{ hashFiles(format('{0}{1}', github.workspace, '/mix.lock')) }}
      - id: plt_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: dialyzer_cache
          key: ${{ runner.os }}-${{ env.elixir_version }}-${{ env.otp_version }}-dialyzer_cache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ env.elixir_version }}-${{ env.otp_version }}-dialyzer_cache-
      - uses: erlef/setup-beam@v1.18
        with:
          otp-version: ${{ env.otp_version }}
          elixir-version: ${{ env.elixir_version }}
      - name: Install Dependencies
        run: mix deps.get
      - name: Create PLTs dir
        if: ${{steps.plt_cache.outputs.cache-hit != 'true'}}
        run: mkdir -p dialyzer_cache && mix dialyzer --plt
      - name: Run dialyzer
        # FIXME: This should be set to fail when dialyzer issues are fixed
        run: mix dialyzer || exit 0

  test-credo:
    name: Credo
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: team-alembic/staple-actions/actions/mix-credo@a74b3b61209d35d45526df174766632f8aee03ed
        with:
          working-directory: .
          mix-env: dev

  test-coverage:
    name: Build and Test
    runs-on: ubuntu-26.04
    # Wait for Dialyzer to give it a go before building
    needs:
      - test-dialyzer
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: deps
          key: ${{ runner.os }}-${{ env.elixir_version }}-${{ env.otp_version }}-mix-${{ hashFiles(format('{0}{1}', github.workspace, '/mix.lock')) }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: _build
          key: ${{ runner.os }}-${{ env.elixir_version }}-${{ env.otp_version }}-_build-${{ hashFiles(format('{0}{1}', github.workspace, '/mix.lock')) }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ env.elixir_version }}-${{ env.otp_version }}-_build-${{ hashFiles(format('{0}{1}', github.workspace, '/mix.lock')) }}
      - uses: erlef/setup-beam@v1.18
        with:
          otp-version: ${{ env.otp_version }}
          elixir-version: ${{ env.elixir_version }}
      - name: Install Dependencies
        run: mix deps.get
      - name: Check formatting
        run: mix format --check-formatted
      - name: Compile
        run: mix compile
      - name: Test and Coverage
        run: mix coveralls.json  --exclude wip -o coverage_results
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        name: Upload Coverage Results to CodeCov
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  test-deps-audit:
    name: Deps Audit
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: team-alembic/staple-actions/actions/mix-task@a74b3b61209d35d45526df174766632f8aee03ed
        with:
          working-directory: .
          mix-env: test
          task: deps.audit
