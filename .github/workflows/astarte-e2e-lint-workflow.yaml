name: Astarte E2E Next lint

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/astarte-e2e-next/**"
      - ".github/workflows/astarte-e2e-lint-workflow.yaml"
  push:
    branches:
      - master
      - "release-[0-9]+.[0-9]+"
    paths:
      - "tools/astarte-e2e-next/**"
      - ".github/workflows/astarte-e2e-lint-workflow.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  lint:
    name: Lint and unit test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/astarte-e2e-next
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: cargo-nextest
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
      - run: task ci
