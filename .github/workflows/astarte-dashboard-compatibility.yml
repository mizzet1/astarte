name: Astarte-Dashboard Platform build compatibility
on:
  push:
    branches:
      - master
      - "release-*"
    paths:
      - "astarte-dashboard/**"
      - ".github/workflows/astarte-dashboard-compatibility.yml"
  create:
  pull_request:
    paths:
      - "astarte-dashboard/**"
      - ".github/workflows/astarte-dashboard-compatibility.yml"

jobs:
  build:
    name: Node ${{ matrix.node_version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./astarte-dashboard
    strategy:
      matrix:
        os:
          - ubuntu-latest
        node_version:
          - 22
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Use Node.js ${{ matrix.node_version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node_version }}
      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            **/node_modules
          key: ${{ matrix.os }}-${{ matrix.node_version }}-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        run: npm ci --production
      - name: Check App compilation
        run: npm run build
        env:
          CI: false
