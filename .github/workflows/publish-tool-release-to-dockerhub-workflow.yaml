# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: Publish Docker images of Astarte tools

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target_tag:
        description: "The ref run this workflow against (e.g., v1.0.0)"
        required: true
        type: string

jobs:
  build_release:
    name: Push Docker images of Astarte tools to Docker Hub
    runs-on: ${{ matrix.platform.os }}
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        platform:
          - os: ubuntu-24.04
            platform: linux/amd64
            platform-pair: linux-amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            platform-pair: linux-arm64
        app:
          - tool: astarte_device_fleet_simulator
            context: tools/astarte_device_fleet_simulator
            file: tools/astarte_device_fleet_simulator/Dockerfile
          - tool: astarte_e2e
            context: .
            file: tools/astarte_e2e/Dockerfile
          - tool: astarte_export
            context: .
            file: tools/astarte_export/Dockerfile
          - tool: astarte_import
            context: .
            file: tools/astarte_import/Dockerfile
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.target_tag || github.ref }}

      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: ${{ matrix.app.context }}
          file: ${{ matrix.app.file }}
          push: true
          tags: astarte/${{ matrix.app.tool }}
          platforms: ${{ matrix.platform.platform }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests/
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.app.tool }}-digests-${{ matrix.platform.platform-pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge_images:
    name: Publish release
    runs-on: ubuntu-26.04
    needs:
      - build_release
    strategy:
      fail-fast: true
      matrix:
        app:
          - astarte_device_fleet_simulator
          - astarte_e2e
          - astarte_export
          - astarte_import
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: ${{ runner.temp }}/digests/
          pattern: ${{ matrix.app }}-digests-*
          merge-multiple: true

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Extract metadata (tags, labels) of Astarte tools for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: |
            astarte/${{ matrix.app }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.target_tag || github.event.release.tag_name }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests/
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'astarte/${{ matrix.app }}@sha256:%s ' *)
