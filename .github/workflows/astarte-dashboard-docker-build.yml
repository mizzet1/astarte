name: Test Astarte-Dashboard Container Builds
on:
  push:
    branches:
      - "master"
      - "release-[0-9]+.[0-9]+"
    paths:
      - "astarte-dashboard/**"
      - ".github/workflows/astarte-dashboard-docker-build.yml"
  create:
  pull_request:
    paths:
      - "astarte-dashboard/**"
      - ".github/workflows/astarte-dashboard-docker-build.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  docker:
    name: Test Container Build (astarte-dashboard)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build
        id: docker_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./astarte-dashboard
          file: ./astarte-dashboard/Dockerfile
          push: false
